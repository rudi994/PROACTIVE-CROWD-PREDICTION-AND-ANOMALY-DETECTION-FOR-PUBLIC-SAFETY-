<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crowd Alerts</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        h1 { color: #d32f2f; }
        .alert { background: white; padding: 10px; margin: 10px 0; border-left: 5px solid #d32f2f; }
    </style>
</head>
<body>
    <h1>🚨 Crowd Detection Alerts</h1>
    {% if alerts %}
        {% for alert in alerts %}
        <div class="alert">
            <strong>Time:</strong> {{ alert.timestamp }} <br>
            <strong>Crowd Count:</strong> {{ alert.crowd_count }} <br>
            <strong>Anomaly Score:</strong> {{ alert.anomaly_score }} <br>
            <strong>Frame ID:</strong> {{ alert.frame_id }}
        </div>
        {% endfor %}
    {% else %}
        <p>No alerts yet.</p>
    {% endif %}
</body>
</html>
